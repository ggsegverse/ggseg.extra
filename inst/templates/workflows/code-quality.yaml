on:
  push:
    branches: [main, master]
  # No branches filter: with one, a PR stacked on another branch skips this
  # check entirely and only gets gated once it is retargeted at main.
  pull_request:

name: code-quality

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    uses: ggsegverse/.github/.github/workflows/code-quality.yaml@main
    with:
      # An atlas package's dependencies include ggseg, whose DESCRIPTION floor
      # names a ggseg.formats newer than CRAN's. Resolution has to see the
      # r-universe or it fails before the check starts. Remove this once
      # ggseg.formats is on CRAN at the floor ggseg asks for.
      extra-repositories: https://ggsegverse.r-universe.dev
    secrets: inherit
