on:
  push:
    branches: [main, master]
  # Builds on every PR so a broken reference index or vignette fails review
  # rather than main. The reusable guards its deploy step with
  # `github.event_name != 'pull_request'`, so PRs build without publishing.
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    uses: ggsegverse/.github/.github/workflows/pkgdown.yaml@main
    with:
      # An atlas package's dependencies include ggseg, whose DESCRIPTION floor
      # names a ggseg.formats newer than CRAN's. Resolution has to see the
      # r-universe or it fails before the check starts. Remove this once
      # ggseg.formats is on CRAN at the floor ggseg asks for.
      extra-repositories: https://ggsegverse.r-universe.dev
      # ggseg.docs supplies the shared pkgdown template, declared in
      # DESCRIPTION as Config/Needs/website.
      extra-packages: |
        any::pkgdown
        any::quarto
        local::.
