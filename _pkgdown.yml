url: https://ggsegverse.github.io/ggseg.extra/

template:
  package: ggseg.docs

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fa-github
      href: https://github.com/ggsegverse/ggseg.extra
      aria-label: GitHub
    articles:
      text: Articles
      menu:
        - text: Getting Started
        - text: Introduction
          href: articles/ggseg.extra.html
        - text: Atlas Creation Workflows
          href: articles/atlas-workflows.html
        - text: System Setup
          href: articles/system-setup.html
        - text: -------
        - text: How-To
        - text: Pipeline Configuration
          href: articles/pipeline-configuration.html
        - text: Post-Processing
          href: articles/post-processing.html
        - text: -------
        - text: "Tutorials: Creating Atlases"
        - text: Cortical Atlas
          href: articles/tutorial-cortical-atlas.html
        - text: Neuromaps Atlas
          href: articles/tutorial-neuromaps-atlas.html
        - text: Subcortical Atlas
          href: articles/tutorial-subcortical-atlas.html
        - text: Whole-Brain Atlas
          href: articles/tutorial-wholebrain-atlas.html
        - text: Cerebellar Atlas
          href: articles/tutorial-cerebellar-atlas.html
        - text: Tract Atlas
          href: articles/tutorial-tract-atlas.html
        - text: Label Atlas
          href: articles/tutorial-label-atlas.html
        - text: -------
        - text: "Tutorials: Working with Atlases"
        - text: Lookup Tables and Colours
          href: articles/tutorial-lookup-tables.html
        - text: Publishing an Atlas
          href: articles/tutorial-publishing-an-atlas.html
        - text: -------
        - text: Legacy & Contributing
        - text: Legacy Conversion
          href: articles/legacy-conversion.html
        - text: Contributing
          href: articles/contributing.html

articles:
  - title: Getting Started
    navbar: ~
    contents:
      - ggseg.extra
      - atlas-workflows
      - system-setup

  - title: How-To
    desc: Understanding package functionality
    contents:
      - pipeline-configuration
      - post-processing

  - title: "Tutorials: Creating Atlases"
    desc: Step-by-step atlas creation with full pipelines
    contents:
      - articles/tutorial-cortical-atlas
      - articles/tutorial-neuromaps-atlas
      - articles/tutorial-subcortical-atlas
      - articles/tutorial-wholebrain-atlas
      - articles/tutorial-cerebellar-atlas
      - articles/tutorial-tract-atlas
      - articles/tutorial-label-atlas

  - title: "Tutorials: Working with Atlases"
    desc: Preparing the inputs an atlas needs, and shipping the result
    contents:
      - articles/tutorial-lookup-tables
      - articles/tutorial-publishing-an-atlas

  - title: Legacy & Contributing
    contents:
      - legacy-conversion
      - contributing

reference:
  - title: Create Brain Atlases
    desc: Turn a parcellation into a `ggseg_atlas` you can plot
    contents:
      - starts_with("create_")

  - title: Shape an Atlas's Geometry
    desc: >
      Simplify, smooth and grow a finished atlas's 2D outlines. These run on
      the returned atlas, not during the build, so retuning one is cheap.
    contents:
      - atlas_polish
      - atlas_simplify
      - atlas_smooth
      - atlas_dilate
      - context_pattern
      - count_vertices

  - title: Curate an Atlas
    desc: >
      The `atlas_region_*` and `atlas_view_*` vocabulary, re-exported from
      ggseg.formats, plus the constructor that validates a hand-edited atlas.
    contents:
      - atlas-verbs

  - title: Atlas Repository
    desc: Create and maintain a ggseg atlas package
    contents:
      - setup_atlas_repo
      - use_atlas_github_actions
      - ggseg_atlas_github_actions
      - sitrep

  - title: Lookup Tables
    desc: Read, write and build FreeSurfer-style colour lookup tables
    contents:
      - read_lut
      - write_lut
      - get_lut
      - is_lut
      - lut_add
      - lut_combine
      - lut_classify_anatomy
      - lut_generate_colors

  - title: Subcortical Helpers
    desc: Compose slice views and anatomical context for subcortical atlases
    contents:
      - subcortical_slabs
      - aseg_context
      - aseg_hidden_labels

  - title: Anatomical Coregistration
    desc: Align an atlas volume to a FreeSurfer subject for anatomical context
    contents:
      - coregister_volume
      - project_volume_anatomical
      - prepare_subcortical_anatomical
      - prepare_subcortical_mni152
      - aseg_subcortical_labels

  - title: Cerebellar Helpers
    desc: SUIT surfaces and MNI-to-SUIT transforms for cerebellar atlases
    contents:
      - suit_flatmap_path
      - suit_3d_path
      - suit_deformation_field
      - transform_mni_to_suit
      - read_suit_parcellation

  - title: Reading Parcellation Files
    desc: Read the formats the creation pipelines accept
    contents:
      - read_annotation_data
      - read_gifti_annotation
      - read_cifti_annotation
      - read_cifti_subcortical
      - read_neuromaps_annotation
      - read_neuromaps_volume
      - read_tractography

  - title: Utilities
    contents:
      - convert_legacy_brain_atlas
      - mri_surf2surf_rereg
      - label_to_region
      - get_verbose
      - as_verbosity

