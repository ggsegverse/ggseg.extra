on:
  push:
    branches: [main, master]
  # No branches filter: with one, a PR stacked on another branch skips this
  # check entirely and only gets gated once it is retargeted at main. The
  # reusable only commits the badge on main/master, so PRs measure without
  # publishing.
  pull_request:

name: test-coverage

permissions:
  contents: write

jobs:
  test-coverage:
    uses: ggsegverse/.github/.github/workflows/test-coverage.yaml@main
    secrets: inherit
    with:
      install-spatial-deps: true
      extra-packages: any::covr, github::drmowinckels/freesurfer@refactor
