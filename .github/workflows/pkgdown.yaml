on:
  push:
    branches: [main, master]
  # Builds on every PR so a broken reference index or vignette fails review
  # rather than main. The reusable guards its deploy step with
  # `github.event_name != 'pull_request'`, so PRs build without publishing.
  # No branches filter: a PR stacked on another branch needs gating too.
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    uses: ggsegverse/.github/.github/workflows/pkgdown.yaml@main
    with:
      install-spatial-deps: true
      extra-packages: |
        any::pkgdown
        any::quarto
        github::drmowinckels/freesurfer@refactor
        local::.
