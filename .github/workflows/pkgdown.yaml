on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    uses: ggsegverse/.github/.github/workflows/pkgdown.yaml@main
    with:
      install-spatial-deps: true
      extra-packages: |
        any::pkgdown
        any::quarto
        github::drmowinckels/freesurfer@refactor
        local::.
