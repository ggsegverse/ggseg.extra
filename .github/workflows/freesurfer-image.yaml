on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *"
  push:
    branches: [main, master]
    paths:
      - ".github/docker/freesurfer-slim/**"
      - ".github/workflows/freesurfer-image.yaml"
  pull_request:
    paths:
      - ".github/docker/freesurfer-slim/**"
      - ".github/workflows/freesurfer-image.yaml"

name: freesurfer-image

permissions:
  contents: read
  packages: write

env:
  R_VERSION: "4.6.1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/freesurfer-slim

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One version failing to build says nothing about the other, and the
      # whole point of testing two is to see them disagree.
      fail-fast: false
      matrix:
        # 7.4.1 is what most installations still are; 8.2.0 is the current
        # release. `latest` follows the older of the two deliberately: it is
        # what freesurfer-tests resolves when nothing pins a version, and
        # that should keep meaning the conservative choice.
        include:
          - fs_version: "7.4.1"
            latest: true
          - fs_version: "8.2.0"
            latest: false
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FS_VERSION: ${{ matrix.fs_version }}
          IS_LATEST: ${{ matrix.latest }}
        run: |
          short="${R_VERSION%.*}"
          ref="$REF"
          # Only the default branch may move the version tags. They are what
          # freesurfer-tests runs in, across every branch, so a pull request
          # pushing them replaces the image the other pull requests and main
          # are tested against - which is how removing ImageMagick from this
          # Dockerfile broke `magick --version` in their smoke test. A pull
          # request gets a tag of its own, proving the image still builds
          # without standing in for the published one.
          if [ "$ref" = "$DEFAULT_BRANCH" ]; then
            tags="${IMAGE}:${FS_VERSION}-r${R_VERSION}"
            tags="${tags},${IMAGE}:${FS_VERSION}-r${short}"
            if [ "$IS_LATEST" = "true" ]; then
              tags="${tags},${IMAGE}:latest"
            fi
          else
            # The branch tag carries the version too, or the two matrix legs
            # would overwrite each other and the second would be tested as
            # the first.
            tags="${IMAGE}:$(echo "$ref" | tr '/' '-')-fs${FS_VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker/freesurfer-slim
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FS_VERSION=${{ matrix.fs_version }}
            R_VERSION=${{ env.R_VERSION }}

      - name: Report image size
        run: docker image ls "${IMAGE}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
