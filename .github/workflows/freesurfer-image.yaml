on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *"
  push:
    branches: [main, master]
    paths:
      - ".github/docker/freesurfer-slim/**"
      - ".github/workflows/freesurfer-image.yaml"
  pull_request:
    paths:
      - ".github/docker/freesurfer-slim/**"
      - ".github/workflows/freesurfer-image.yaml"

name: freesurfer-image

permissions:
  contents: read
  packages: write

env:
  FS_VERSION: "7.4.1"
  R_VERSION: "4.5.3"
  IMAGE: ghcr.io/${{ github.repository_owner }}/freesurfer-slim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Report builder disk before build
        run: df -h / /mnt 2>/dev/null || df -h /

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          short="${R_VERSION%.*}"
          tags="${IMAGE}:${FS_VERSION}-r${R_VERSION},${IMAGE}:${FS_VERSION}-r${short}"
          ref="$REF"
          if [ "$ref" = "$DEFAULT_BRANCH" ]; then
            tags="${tags},${IMAGE}:latest"
          else
            tags="${tags},${IMAGE}:$(echo "$ref" | tr '/' '-')"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker/freesurfer-slim
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FS_VERSION=${{ env.FS_VERSION }}
            R_VERSION=${{ env.R_VERSION }}

      - name: Report image size
        run: |
          docker image ls "${IMAGE}" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
          df -h /
