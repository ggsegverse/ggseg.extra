# Keeps pkgdown/assets/articles.json in step with the articles it describes.
#
# The index exists because `vignettes/articles/` is Rbuildignored: the
# pre-knit tutorials never enter the tarball, so r-universe's metadata never
# lists them and anything built from that metadata -- the ggsegverse website's
# documentation page -- cannot see them. pkgdown copies `pkgdown/assets/` to
# the site root, so the file deploys with the pages it indexes.
#
# It is committed rather than generated during the pkgdown build so that the
# site always deploys an index matching the tree it was built from. That only
# holds if the committed copy is never stale, hence the PR check: a PR that
# adds, renames or retitles an article fails until its author regenerates the
# index, which means main is already correct when pkgdown builds it. The
# commit step on main is a safety net for direct pushes, and is a no-op for
# anything that went through a PR.

on:
  push:
    branches: [main, master]
    paths:
      - "vignettes/**"
      - "_pkgdown.yml"
      - "DESCRIPTION"
      - ".Rbuildignore"
      - "dev/build-articles-index.R"
      - ".github/workflows/articles-index.yaml"
  pull_request:
    paths:
      - "vignettes/**"
      - "_pkgdown.yml"
      - "DESCRIPTION"
      - ".Rbuildignore"
      - "dev/build-articles-index.R"
      - ".github/workflows/articles-index.yaml"
  workflow_dispatch:

name: articles-index

permissions:
  contents: write

jobs:
  articles-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The script reads _pkgdown.yml and the article front matter as text; it
      # never loads the package, so the heavy spatial dependency chain that
      # every other workflow here needs is not installed.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite

      - name: Check the committed index is current
        if: github.event_name == 'pull_request'
        run: Rscript dev/build-articles-index.R --check

      - name: Rebuild and commit the index
        if: github.event_name != 'pull_request'
        run: |
          Rscript dev/build-articles-index.R
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgdown/assets/articles.json
          git diff --staged --quiet || {
            git commit -m "Rebuild the pkgdown articles index"
            git push
          }
