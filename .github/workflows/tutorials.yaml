# Keeps the tutorials honest.
#
# Most of them are pre-compiled: their code is text that nobody re-runs, so it
# can go on telling readers to call an argument that moved years ago. That is
# not hypothetical -- nine documents recommended `atlas_smooth(keep = 0.2)`
# long after `keep` moved to `atlas_simplify()`.
#
# Two jobs, because no single check covers all of them:
#
#   api-audit   every vignette, seconds, no dependencies. Static: does each
#               function exist, does it take these arguments. Catches the
#               whole class of drift above, including in tutorials that can
#               never be built here.
#
#   build       the tutorials whose inputs a runner actually has, rendered
#               for real inside the FreeSurfer image. Catches what static
#               analysis cannot: a call that resolves but errors.
#
# Cortical, label, subcortical and tract build from what the image carries --
# fsaverage5, and the one trctrain subject the tract tutorial uses; cerebellar
# fetches a 12 KB SUIT parcellation from the same Diedrichsen Lab repository
# the package already pulls its deformation field from.
#
# Deliberately not built: wholebrain needs a Harvard-Oxford volume that only
# ships with FSL, and neuromaps downloads its annotation at run time. The
# audit is the only cover those two have, plus the synthetic pipeline tests in
# tests/testthat/.
#
# The lookup-table tutorial is absent from both jobs on purpose: it renders
# live, so the pkgdown workflow already executes it on every PR.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

name: tutorials

permissions:
  contents: read
  packages: read

jobs:
  api-audit:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check

      - name: Audit every vignette against the package API
        run: Rscript dev/audit-tutorial-api.R

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/freesurfer-slim:7.4.1-r4.6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FS_LICENSE: /opt/freesurfer/license.txt
    steps:
      - uses: actions/checkout@v6

      - name: Install FreeSurfer license
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          if [ -z "$FREESURFER_LICENSE" ]; then
            echo "::error::FREESURFER_LICENSE secret is not set; the tutorials would silently skip."
            exit 1
          fi
          printf '%s\n' "$FREESURFER_LICENSE" > "$FS_LICENSE"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::knitr, any::fs
          needs: check

      - name: Knit the tutorials a runner can build
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          source("data-raw/build_tutorials.R")

          # Every chunk is gated on `can_run`, which is FreeSurfer being
          # usable. When that is FALSE the knit still "succeeds" and quietly
          # writes a tutorial with no output at all -- worse than failing --
          # so the precondition is asserted first. It is checked directly
          # rather than through set_tutorial_options(), which needs a live
          # knit context to know which file it is configuring.
          if (!freesurfer::have_fs()) {
            stop(
              "FreeSurfer is not usable here, so the tutorials would knit ",
              "to empty output instead of failing."
            )
          }

          # The cerebellar tutorial degrades to its unevaluated form when the
          # SUIT parcellation cannot be fetched, which would let this job pass
          # on a page with no output in it. Fetch it up front and fail here
          # instead.
          if (is.null(tutorial_suit_parcellation())) {
            stop("could not fetch the SUIT parcellation the cerebellar tutorial needs")
          }

          tutorials <- c(
            "vignettes/tutorial-cerebellar-atlas.qmd.orig",
            "vignettes/tutorial-cortical-atlas.qmd.orig",
            "vignettes/tutorial-label-atlas.qmd.orig",
            "vignettes/tutorial-subcortical-atlas.qmd.orig",
            "vignettes/tutorial-tract-atlas.qmd.orig"
          )

          # Knitting writes the .qmd next to its source. The rendered output
          # carries timings, console widths and temp paths, so it is never
          # compared against what is committed -- the question here is only
          # whether the code still runs.
          for (tutorial in tutorials) {
            knit_tutorials(tutorial)
          }

      - name: Fail on errors captured in the rendered output
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for f in vignettes/tutorial-cerebellar-atlas.qmd \
                   vignettes/tutorial-cortical-atlas.qmd \
                   vignettes/tutorial-label-atlas.qmd \
                   vignettes/tutorial-subcortical-atlas.qmd \
                   vignettes/tutorial-tract-atlas.qmd; do
            if grep -nE '^#> (Error|Quitting)' "$f"; then
              echo "::error file=$f::the tutorial rendered an error"
              status=1
            fi
          done
          exit $status

      - name: Show what re-knitting changed
        if: always()
        shell: bash
        run: |
          # Informational only. Timings and console widths differ from
          # whoever last knitted, so a diff here is expected and is not a
          # failure; it is printed so a surprising one is at least visible.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --stat -- vignettes/ || true
