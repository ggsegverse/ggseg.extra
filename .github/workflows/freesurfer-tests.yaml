on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

name: freesurfer-tests

permissions:
  contents: read
  packages: read

jobs:
  freesurfer-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/freesurfer-slim:7.4.1-r4.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      FS_LICENSE: /opt/freesurfer/license.txt
    steps:
      - uses: actions/checkout@v6

      # Exercises every retained binary and the fsaverage5 subject directly,
      # so a broken image fails here before any R is involved.
      - name: Smoke-test FreeSurfer binaries
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          aseg=tests/testthat/testdata/volumetric/aseg.mgz
          mri_info "$aseg" > /dev/null
          mri_convert "$aseg" "$work/aseg.nii.gz" > /dev/null
          mri_pretess "$aseg" 10 "$aseg" "$work/pretess.mgz" > /dev/null
          mri_tessellate "$work/pretess.mgz" 10 "$work/lh.surf" > /dev/null
          mris_smooth -nw -n 2 "$work/lh.surf" "$work/lh.smooth" > /dev/null
          mri_vol2surf --mov "$aseg" --regheader fsaverage5 --hemi lh \
            --projfrac 0.5 --interp nearest --o "$work/lh.header.mgh" > /dev/null
          mri_vol2surf --mov "$aseg" --reg "$FREESURFER_HOME/average/mni152.register.dat" \
            --srcsubject fsaverage5 --hemi lh --projfrac 0.5 --interp nearest \
            --o "$work/lh.mni152.mgh" > /dev/null
          mri_vol2vol --mov "$aseg" --targ "$aseg" --regheader --nearest \
            --o "$work/vol2vol.mgz" > /dev/null
          ls -l "$work"

      - name: Install FreeSurfer license
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          if [ -z "$FREESURFER_LICENSE" ]; then
            echo "::error::FREESURFER_LICENSE secret is not set; FreeSurfer tests would silently skip."
            exit 1
          fi
          printf '%s\n' "$FREESURFER_LICENSE" > "$FS_LICENSE"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            github::muschellij2/freesurfer

      - name: Run test suite with FreeSurfer available
        run: Rscript .github/scripts/run-freesurfer-tests.R
